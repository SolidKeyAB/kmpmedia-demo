#Gradle
org.gradle.jvmargs=-Xmx6g -XX:+PrintGCDetails -Dfile.encoding=UTF-8 -Dkotlin.daemon.jvm.options\="-Xmx6g"
org.gradle.daemon=true
org.gradle.caching=true
org.gradle.configuration-cache=false
org.gradle.parallel=true
org.gradle.unsafe.configuration-cache=false
org.gradle.incremental=true
org.gradle.workers.max=8
org.gradle.configuration-on-demand=false

#Kotlin
kotlin.native.cacheKind=static
kotlin.code.style=official
kotlin.native.cacheKind.iosX64=none
kotlin.native.cinterop.cacheKind=static
compose.kotlin.native.manageCacheKind=false
kotlin.compiler.execution.strategy=daemon
kotlin.daemon.jvm.options=-Xmx2g // Set to 2GB
kotlin.incremental=true
kotlin.native.incremental=true

kotlin.native.cacheKind.iosArm64=none
kotlin.native.cacheKind.iosSimulatorArm64=none
kotlin.mpp.enableCInteropCommonization=true

#Android
android.useAndroidX=true
android.nonTransitiveRClass=true
android.enableJetifier=false
#IOS
compose.experimental.uikit.enabled=true
