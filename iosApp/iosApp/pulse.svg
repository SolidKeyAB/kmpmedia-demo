<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
    <!-- Purple diamond that pulses (scales) in place. The player pivots `scale`
         about the viewBox centre, so it grows/shrinks around its middle. Peak 1.2x
         of r=30 -> 36 from centre, still inside the box. -->
    <polygon points="50,20 80,50 50,80 20,50" fill="#B388FF" stroke="#6200EA" stroke-width="3">
        <animateTransform attributeName="transform" type="scale"
            values="0.65,0.65; 1.2,1.2; 0.65,0.65" dur="1.2s" repeatCount="indefinite"/>
    </polygon>
</svg>
