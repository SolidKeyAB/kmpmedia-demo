<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
    <!-- Blue ball that bounces up and down. `values` is a there-and-back keyframe
         list so it loops smoothly with no snap. Stays inside the box (r=18, +/-30). -->
    <circle cx="50" cy="50" r="18" fill="#4FC3F7" stroke="#0277BD" stroke-width="3">
        <animateTransform attributeName="transform" type="translate"
            values="0,-30; 0,30; 0,-30" dur="1.0s" repeatCount="indefinite"/>
    </circle>
</svg>
