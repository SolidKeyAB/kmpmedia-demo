  <ellipse cx="50" cy="58" rx="44" ry="14" fill="#374151"/>
  <ellipse cx="50" cy="54" rx="44" ry="11" fill="#9CA3AF"/>
  <ellipse cx="50" cy="51" rx="38" ry="5" fill="#D1D5DB"/>
  <!-- Under-lights -->
  <circle cx="24" cy="56" r="3" fill="#FDE047"/>
  <circle cx="37" cy="56" r="3" fill="#F472B6"/>
  <circle cx="50" cy="56" r="3" fill="#FDE047"/>
