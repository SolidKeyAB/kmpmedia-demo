<?xml version="1.0" encoding="UTF-8"?>
<svg width="500" height="500" viewBox="0 0 500 500" xmlns="http://www.w3.org/2000/svg">
    <!-- Linear Gradient -->
    <defs>
        <linearGradient id="linearGradientTest" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="red"/>
            <stop offset="50%" stop-color="blue"/>
            <stop offset="100%" stop-color="green"/>
        </linearGradient>

        <!-- Radial Gradient -->
        <radialGradient id="radialGradientTest" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="yellow"/>
            <stop offset="100%" stop-color="blue"/>
        </radialGradient>
    </defs>

    <!-- Rectangle with Linear Gradient -->
    <rect x="150" y="150" width="200" height="100" fill="url(#linearGradientTest)" stroke="black" stroke-width="2"/>

    <!-- Circle with Radial Gradient -->
    <circle cx="350" cy="100" r="50" fill="url(#radialGradientTest)" stroke="black" stroke-width="2"/>
</svg>
